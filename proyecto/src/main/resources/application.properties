spring.application.name=proyecto

# MySQL - funciona en local (localhost) y en Docker (nombre servicio mysql)
# En docker-compose se sobreescribe con SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aprendiz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB - funciona en local y en Docker
# En docker-compose se sobreescribe con SPRING_MONGODB_URI
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/aprendiz}